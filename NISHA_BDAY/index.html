<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday NISHA! 🎉✨</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a; overflow-x: hidden; min-height: 100vh; text-align: center;
        }

        .heart-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .heart {
            position: absolute; bottom: -20px; color: #ff4d6d;
            font-size: 20px; opacity: 0.6; animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(-105vh) translateX(var(--randomX)) rotate(360deg); opacity: 0; }
        }

        .main-container {
            position: relative; z-index: 2; max-width: 650px;
            margin: 50px auto; padding: 20px;
        }

        .welcome-card {
            background: #fffdf9; padding: 40px 30px; border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
            border: 2px dashed #ffb3c1; text-align: center;
        }

        h1 { color: #ff4d6d; font-size: 2.5rem; margin-bottom: 10px; }
        p.subtitle { font-size: 1.2rem; color: #666; margin-bottom: 20px; line-height: 1.6; }

        .video-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .birthday-banner-video {
            max-width: 280px; width: 100%; height: auto;
            border-radius: 20px; border: 4px solid white;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.25);
            cursor: pointer;
        }

        .video-hint {
            font-size: 0.85rem;
            color: #ff4d6d;
            font-weight: bold;
            margin-top: -15px;
            margin-bottom: 25px;
        }

        .button-group {
            display: flex; flex-direction: column; gap: 15px;
            align-items: center; justify-content: center;
        }

        .btn-primary {
            display: block; width: 80%; max-width: 320px; padding: 15px 20px;
            background: linear-gradient(45deg, #ff758f, #ff4d6d);
            color: white; font-weight: bold; font-size: 1.1rem;
            text-decoration: none; border-radius: 30px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-secondary {
            display: block; width: 80%; max-width: 320px; padding: 15px 20px;
            background: white; color: #ff4d6d; font-weight: bold; font-size: 1.1rem;
            text-decoration: none; border-radius: 30px; border: 2px solid #ff4d6d;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .btn-primary:hover, .btn-secondary:hover { transform: translateY(-3px); }
    </style>
</head>
<body>

    <div class="heart-container" id="heartContainer"></div>

    <div class="main-container">
        <div class="welcome-card">
            <h1>🎂 HAPPIEST BIRTHDAY NISHA NASHEDI! 🥳</h1>
            <p class="subtitle">Welcome to your official birthday experience! I've created a fun little challenge and a heartfelt letter just for you.</p>

            <div class="video-wrapper">
                <video class="birthday-banner-video" id="bdayVideo" autoplay loop muted playsinline controls>
                    <source src="gifs/bdaywish.mp4" type="video/mp4">
                </video>
            </div>
            <div class="video-hint">🔊 Tap video to enable sound (pauses background music)</div>

            <div class="button-group">
                <a href="games.html" class="btn-primary">🎮 Play Birthday Vault Game</a>
                <a href="letter.html" class="btn-secondary">✉️ Read Birthday Letter Directly</a>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="audio/a-cheerful-ukulele-waltz.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Floating Heart Particles Animation
        const container = document.getElementById('heartContainer');
        const particles = ['❤️', '💖', '🎈', '✨', '🎂', '🥳'];
        function addHeart() {
            const h = document.createElement('div');
            h.classList.add('heart');
            h.innerText = particles[Math.floor(Math.random() * particles.length)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 12 + 15 + 'px';
            h.style.setProperty('--randomX', (Math.random() * 200 - 100) + 'px');
            const dur = Math.random() * 2 + 4;
            h.style.animationDuration = dur + 's';
            container.appendChild(h);
            setTimeout(() => h.remove(), dur * 1000);
        }
        setInterval(addHeart, 300);

        // Music & Video Audio Sync Controller
        const music = document.getElementById('bgMusic');
        const video = document.getElementById('bdayVideo');

        function startMusicOnInteraction() {
            music.play().then(() => {
                document.removeEventListener('click', startMusicOnInteraction);
                document.removeEventListener('touchstart', startMusicOnInteraction);
            }).catch(e => console.log("Awaiting activation..."));
        }
        document.addEventListener('click', startMusicOnInteraction);
        document.addEventListener('touchstart', startMusicOnInteraction);

        // Smart Audio Manager: Pause bgMusic when video audio plays, resume when video is muted or paused
        video.addEventListener('volumechange', () => {
            if (!video.muted && video.volume > 0) {
                music.pause();
            } else {
                music.play().catch(e => console.log(e));
            }
        });

        video.addEventListener('play', () => {
            if (!video.muted && video.volume > 0) {
                music.pause();
            }
        });

        video.addEventListener('pause', () => {
            music.play().catch(e => console.log(e));
        });

        video.addEventListener('ended', () => {
            music.play().catch(e => console.log(e));
        });

        music.addEventListener('ended', function() {
            this.currentTime = 0;
            this.play().catch(e => console.log("Loop backup recovery execution failed:", e));
        }, false);
    </script>
</body>
</html>
