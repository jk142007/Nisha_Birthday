<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Birthday Vault Challenge 🎈</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a; overflow-x: hidden; min-height: 100vh; text-align: center;
        }

        .heart-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .heart {
            position: absolute; bottom: -20px; color: #ff4d6d;
            font-size: 20px; opacity: 0.6; animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(-105vh) translateX(var(--randomX)) rotate(360deg); opacity: 0; }
        }

        .game-container { position: relative; z-index: 2; max-width: 650px; margin: 40px auto; padding: 20px; }
        h1 { color: #ff4d6d; font-size: 2.5rem; margin-bottom: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.05); }
        .subtitle { font-size: 1.1rem; color: #c9184a; margin-bottom: 30px; }

        .puzzle-card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: left; margin-bottom: 20px; }
        .stage-badge { background: #ff4d6d; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; display: inline-block; margin-bottom: 15px; }
        
        .riddle-text {
            font-size: 1.15rem; line-height: 1.6; color: #333; background: #fff0f3;
            padding: 15px; border-radius: 10px; border-left: 4px solid #ff758f;
            font-family: 'Courier New', Courier, monospace; white-space: pre-line;
        }

        .input-group { margin-top: 25px; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px 20px; border: 2px solid #ffb3c1; border-radius: 25px; font-size: 1rem; outline: none; }
        input[type="text"]:focus { border-color: #ff4d6d; }

        .submit-btn { background: #ff4d6d; color: white; border: none; padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; }
        .submit-btn:hover { background: #c9184a; }

        .result-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 229, 236, 0.97); z-index: 100;
            justify-content: center; align-items: center; flex-direction: column; padding: 20px; box-sizing: border-box;
        }

        .result-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-width: 480px; width: 100%; }
        .result-video { max-width: 100%; height: 200px; border-radius: 15px; margin: 15px 0; outline: none; }
        
        .action-btn { background: #ff4d6d; color: white; border: none; padding: 12px 30px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; margin-top: 10px; }
        .action-btn:hover { background: #c9184a; }
        .home-link { display: inline-block; margin-top: 20px; color: #c9184a; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="heart-container" id="heartContainer"></div>

    <div class="game-container">
        <h1>🎉 The Fun Birthday Vault 🎉</h1>
        <p class="subtitle">Answer 3 easy questions to unlock the vault and read your letter!</p>

        <div class="puzzle-card">
            <div class="stage-badge" id="stageBadge">Stage 1 / 3</div>
            <p id="riddleText" class="riddle-text">Loading question...</p>
            
            <div class="input-group">
                <input type="text" id="answerInput" placeholder="Type your answer here..." autocomplete="off">
                <button class="submit-btn" onclick="checkAnswer()">Verify Key 🔐</button>
            </div>
        </div>

        <a href="index.html" class="home-link">⬅ Back to Wishes Page</a>
    </div>

    <!-- MEME / RESULT POPUP SCREEN -->
    <div class="result-screen" id="resultScreen">
        <div class="result-card">
            <h2 id="resultTitle" style="color: #ff4d6d;">Result Title</h2>
            <p id="resultMessage" style="font-size: 1.05rem; line-height: 1.5; color: #555;"></p>
            <video class="result-video" id="resultVideoPlayer" autoplay loop muted playsinline></video>
            <br>
            <button class="action-btn" id="resultBtn" onclick="handleResultAction()">Action Button</button>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="audio/a-cheerful-ukulele-waltz.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Floating Background Particles
        const container = document.getElementById('heartContainer');
        function addHeart() {
            const h = document.createElement('div');
            h.classList.add('heart');
            h.innerText = ['❤️', '💖', '🎈', '✨', '🎂', '🥳'][Math.floor(Math.random() * 6)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 12 + 15 + 'px';
            h.style.setProperty('--randomX', (Math.random() * 200 - 100) + 'px');
            const dur = Math.random() * 2 + 4;
            h.style.animationDuration = dur + 's';
            container.appendChild(h);
            setTimeout(() => h.remove(), dur * 1000);
        }
        setInterval(addHeart, 300);

        // Stage Configuration
        const stages = [
            {
                riddle: "Question 1:\nWho is the officially certified birthday star of today? 👑\n\n(Hint: Her name starts with 'N')",
                acceptedAnswers: ["NISHA", "NISHLI", "ME YEDI", "PAGAL AURAT", "NISHA NASHEDI"]
            },
            {
                riddle: "Question 2:\nWhich stupid creature says 'dacha bandh rakhna' and is the most harami (who surprise you with such a beautiful website)? 🐱\n\n(Hint: chal na be pagal aurat itna to pata hona chahaiye)",
                acceptedAnswers: ["Billu", "Khushi", "Khushali", "JK"]
            },
            {
                riddle: "Question 3:\nWhat is 2 + 2? 🧠✨\n\n(No trick questions here chal aaj k liye chhod diya tujhko bday k din kya hard maths puchne ka , promise!)",
                acceptedAnswers: ["4", "FOUR"]
            }
        ];

        let currentStageIndex = 0;
        let gameState = "playing";
        let consecutiveFails = 0;

        function loadStage() {
            if (currentStageIndex < stages.length) {
                document.getElementById('stageBadge').innerText = `Stage ${currentStageIndex + 1} / ${stages.length}`;
                document.getElementById('riddleText').innerText = stages[currentStageIndex].riddle;
                document.getElementById('answerInput').value = "";
            } else {
                triggerGrandWin();
            }
        }

        function checkAnswer() {
            const playerInput = document.getElementById('answerInput').value.trim().toUpperCase();
            const currentStage = stages[currentStageIndex];

            if (currentStage.acceptedAnswers.includes(playerInput)) {
                consecutiveFails = 0;
                currentStageIndex++;
                if (currentStageIndex >= stages.length) {
                    triggerGrandWin();
                } else {
                    triggerStageSuccess();
                }
            } else {
                consecutiveFails++;
                triggerFailure();
            }
        }

        function triggerStageSuccess() {
            gameState = "stage_clear";
            showPopup(
                "🟢 STAGE CLEARED!",
                "Spot on! Moving right along to the next stage.",
                "gifs/ghumi ghumi.mp4",
                "Next Stage ➡️"
            );
        }

        function triggerFailure() {
            gameState = "lost";
            if (consecutiveFails === 1) {
                showPopup(
                    "😭 INCORRECT ANSWER!",
                    "Aww, wrong answer! Look how sad Bubu is right now! Try again!",
                    "gifs/crying bubu.mp4",
                    "Try Again 🔄"
                );
            } else {
                showPopup(
                    "💥 CONSECUTIVE FAILURE BONK!",
                    "Ouch! Still wrong! Dudu is here to smack some sense into you!",
                    "gifs/hitting dudu.mp4",
                    "Try Again 🔄"
                );
            }
        }

        function triggerGrandWin() {
            gameState = "won_all";
            showPopup(
                "👑 THE VAULT IS YOURS!!! 👑",
                "Congratulations! You crushed all 3 stages like an absolute boss!",
                "gifs/dance.mp4", 
                "Read Your Birthday Letter ✉️"
            );
        }

        function showPopup(title, message, videoUrl, buttonText) {
            document.getElementById('resultTitle').innerText = title;
            document.getElementById('resultMessage').innerText = message;
            
            const player = document.getElementById('resultVideoPlayer');
            player.src = videoUrl;
            player.load();
            
            document.getElementById('resultBtn').innerText = buttonText;
            document.getElementById('resultScreen').style.display = 'flex';
        }

        function handleResultAction() {
            document.getElementById('resultScreen').style.display = 'none';
            if (gameState === "stage_clear") {
                loadStage();
            } else if (gameState === "lost") {
                document.getElementById('answerInput').focus();
            } else if (gameState === "won_all") {
                window.location.href = "letter.html"; 
            }
            gameState = "playing";
        }

        // Music Controls
        const music = document.getElementById('bgMusic');
        function startMusicOnInteraction() {
            music.play().then(() => {
                document.removeEventListener('click', startMusicOnInteraction);
                document.removeEventListener('touchstart', startMusicOnInteraction);
            }).catch(e => console.log("Awaiting activation..."));
        }
        document.addEventListener('click', startMusicOnInteraction);
        document.addEventListener('touchstart', startMusicOnInteraction);

        music.addEventListener('ended', function() {
            this.currentTime = 0;
            this.play().catch(e => console.log("Loop backup recovery execution failed:", e));
        }, false);

        document.getElementById("answerInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") { checkAnswer(); }
        });

        loadStage();
    </script>
</body>
</html>
